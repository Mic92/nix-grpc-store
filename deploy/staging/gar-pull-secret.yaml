# Staging-only registry pull secret, reconciled from the existing read-only
# GAR credential. Do not copy or commit the credential itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staging-gar-pull
  namespace: nix-build-farm-staging
  labels: {app.kubernetes.io/part-of: nix-build-farm-staging}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: staging-gar-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "europe-west4-docker.pkg.dev": {
                "username": "_json_key",
                "password": {{ .serviceAccount | toJson }},
                "auth": "{{ printf "_json_key:%s" .serviceAccount | b64enc }}"
              }
            }
          }
  data:
    - secretKey: serviceAccount
      remoteRef:
        key: mistral-science-image-pull-rno2-json-key
