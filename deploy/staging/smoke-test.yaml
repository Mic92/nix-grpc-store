# Run with: kubectl --context build-blc -n nix-build-farm-staging apply -f deploy/staging/smoke-test.yaml
# Uses the baseline client image and verifies that the build reaches the
# staging cache. Output is not downloaded into the client's local store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-smoke-build
  namespace: nix-build-farm-staging
  labels: {app.kubernetes.io/part-of: nix-build-farm-staging}
data:
  job.nix: |
    derivation {
      name = "staging-smoke-session-fence";
      system = "aarch64-linux";
      builder = "/bin/sh";
      args = [ "-c" "echo staging-smoke-ok > $out" ];
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: staging-smoke-build
  namespace: nix-build-farm-staging
  labels: {app.kubernetes.io/part-of: nix-build-farm-staging}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: nix-build-farm-staging}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: client
          image: ghcr.io/mic92/nix-grpc-farm-client:0.2.1
          command: [/bin/sh, -euc]
          args:
            - |
              store="grpc://nix-build-farm-staging-nix-grpc-farm.nix-build-farm-staging.svc:50051?ca-cert=/secrets/ca/ca.crt&client-cert=/secrets/client/tls.crt&client-key=/secrets/client/tls.key"
              nix build -L --store "$store" --eval-store auto --no-link -f /job/job.nix
              out=$(nix eval --impure --raw --expr '(import /job/job.nix).outPath')
              test -n "$out"
              wget -qO- "http://niks3-staging/$(basename "$out" | cut -d- -f1).narinfo"
              nix copy --from http://niks3-staging "$out" \
                --option trusted-public-keys 'nix-build-farm-staging-1:obp0+2oZlbj3iIJBu8GZJcivoLcfQ8j+caE+LOHGv9s='
              test "$(cat "$out")" = staging-smoke-ok
          volumeMounts:
            - {name: ca, mountPath: /secrets/ca, readOnly: true}
            - {name: client, mountPath: /secrets/client, readOnly: true}
            - {name: job, mountPath: /job, readOnly: true}
      volumes:
        - name: ca
          secret:
            secretName: nix-build-farm-staging-nix-grpc-farm-ca
            items: [{key: ca.crt, path: ca.crt}]
        - name: client
          secret: {secretName: staging-client-tls}
        - name: job
          configMap: {name: staging-smoke-build}
