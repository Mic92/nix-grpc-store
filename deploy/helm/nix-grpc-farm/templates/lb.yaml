{{- if .Values.lb.enabled }}
{{- $sel := include "farm.lbSelectorLabels" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "farm.fullname" . }}-lb
  labels: {{- include "farm.labels" . | nindent 4 }}
data:
  envoy.json: {{ include "farm.envoy.config" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "farm.fullname" . }}
  labels: {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: lb
  {{- with .Values.lb.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.lb.service.type }}
  selector: {{- $sel | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.lb.service.port }}
      targetPort: grpc
      {{- with .Values.lb.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "farm.fullname" . }}-lb
  labels: {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: lb
spec:
  replicas: {{ .Values.lb.replicas }}
  selector:
    matchLabels: {{- $sel | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "farm.envoy.config" . | sha256sum }}
        {{- with .Values.lb.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- $sel | nindent 8 }}
    spec:
      serviceAccountName: {{ include "farm.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.lb.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lb.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lb.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: envoy
          image: {{ include "farm.lbImage" . }}
          imagePullPolicy: {{ .Values.lbImage.pullPolicy }}
          args: [--base-id, "0", --log-level, warn]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: admin, containerPort: 9901}
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/envoy/envoy.json, subPath: envoy.json, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.tls.lb.existingSecret }}
            - {name: tls-lb, mountPath: /etc/envoy/tls/lb, readOnly: true}
            {{- end }}
            {{- if .Values.tls.clientCA.existingSecret }}
            - {name: tls-ca, mountPath: /etc/envoy/tls/ca, readOnly: true}
            {{- end }}
          {{- with .Values.lb.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "farm.fullname" . }}-lb
        # envoy wants a writable /tmp and /dev/shm (--base-id) with readOnlyRootFilesystem.
        - name: tmp
          emptyDir: {medium: Memory}
        {{- with .Values.tls.lb.existingSecret }}
        - name: tls-lb
          secret: {secretName: {{ . }}}
        {{- end }}
        {{- with .Values.tls.clientCA.existingSecret }}
        - name: tls-ca
          secret: {secretName: {{ . }}}
        {{- end }}
{{- end }}
