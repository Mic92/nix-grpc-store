image:
  repository: ghcr.io/mic92/nix-grpc-farm
  tag: "" # defaults to appVersion
  pullPolicy: IfNotPresent
lbImage:
  repository: ghcr.io/mic92/nix-grpc-farm-lb
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

niks3:
  # API the workers push to and the scheduler asks what is cached. May be cluster-internal.
  serverURL: ""
  # Binary cache URL as reachable from the workers. They substitute each
  # other's outputs from it. Clients use the same cache, possibly by another name.
  cacheURL: ""
  publicKeys: []
  pushFlags: [] # extra `niks3 push` flags, e.g. [--max-concurrent-uploads, "8"]
  auth:
    # Secret with key `token`, or
    existingSecret: ""
    # a projected service account token. Add "<namespace>:<serviceaccount>"
    # with scope `write` to the niks3 chart's auth.workloadIdentity.allowedServiceAccounts.
    serviceAccountToken:
      enabled: false
      audience: niks3
      expirationSeconds: 3600

# TLS is optional. Secrets are kubernetes.io/tls (tls.crt, tls.key). The CA
# Secret has key ca.crt. cert-manager Certificates produce this layout.
tls:
  # Let cert-manager create the farm CA, an Issuer and the lb/worker
  # certificates in this namespace. Replaces the three existingSecrets below.
  # Issue client certificates from Issuer <release>-nix-grpc-farm.
  certManager:
    enabled: false
    duration: 2160h # leaf certificates, renewed by cert-manager
    caDuration: 87600h
    lb:
      extraDnsNames: [] # names clients outside the cluster use for the balancer
  # Verifies user client certificates at the balancer, the balancer's at
  # the nodes, and worker and scheduler certificates against each other.
  clientCA:
    existingSecret: ""
  # Balancer: server certificate towards clients, also used as client
  # certificate towards workers (its CN must match auth.trustedProxies).
  lb:
    existingSecret: ""
  # Workers and scheduler: server certificate towards the balancer. Workers
  # also present it to the scheduler. Must carry a SAN for
  # <release>-nix-grpc-farm-scheduler[-<i>].<namespace>.svc and, with
  # scheduler.replicas > 1, <release>-nix-grpc-farm.<namespace>.svc.
  worker:
    existingSecret: ""
    # Name the balancer verifies on worker certificates. Empty: chain only.
    serverName: ""

auth:
  # Client certificate CN patterns to roles: read-only | write | trusted.
  # CI that builds through the farm needs `trusted`.
  accessRules: [] # [{cn: "ci-*", role: trusted}]
  anonymousRole: null
  # CNs whose x-forwarded-client-cert header workers believe.
  trustedProxies: [lb]
  # CN patterns of tls.worker certificates. The scheduler trusts these for WorkerSession.
  workerCNs: [worker, "worker-*"]
  # Let pods use the farm with their service account token, see docs/farm.md.
  workloadIdentity:
    enabled: false
    allowedServiceAccounts: [] # "<namespace>:<name>", globs allowed
    scopes: [admin] # read | write | admin (= trusted)
    audience: nix-grpc-farm
    issuer: "" # detected from the pod's service account token
  # Further OIDC providers, same schema as niks3's --oidc-config.
  oidcProviders: {}

# Defaults merged into every entry of `workers`.
workerDefaults:
  system: "" # nix `system`. Empty uses the node's. Required with several groups.
  replicas: 1
  # nix system-features. The scheduler only assigns drvs whose
  # requiredSystemFeatures a worker has.
  features: []
  maxJobs: 1
  cores: 0
  # Below this the worker tells the scheduler to stop assigning to it.
  minFree: 20G
  store:
    sizeLimit: null # emptyDir sizeLimit for /nix
  buildDir:
    medium: "" # "Memory" for tmpfs builds
    sizeLimit: null
  extraNixConf: ""
  resources: {} # nix-daemon container, where builds run
  daemonResources: {} # nix-grpc-daemon container
  nodeSelector: {}
  tolerations: []
  affinity: {}
  spread: true # prefer one pod per node
  podAnnotations: {}
# One Deployment per entry, the key names the group. E.g.
#   x86-64: {system: x86_64-linux, replicas: 4, nodeSelector: {kubernetes.io/arch: amd64}}
#   aarch64: {system: aarch64-linux, replicas: 2, nodeSelector: {kubernetes.io/arch: arm64}}
workers: {}
# Group whose system serves requests without x-nix-system (queries, uploads).
defaultGroup: ""

# The one scheduler pod (all systems). Holds only soft state.
scheduler:
  # >1 adds standby schedulers on separate nodes. niks3 picks the active one
  # through a lock in its database, so this needs a `niks3` no other farm
  # elects against.
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {} # replaces the default anti-affinity between replicas
  podAnnotations: {}
  extraArgs: []

gc:
  # Keep this above every group's minFree so workers do not flap unhealthy.
  ensureFree: 40G
  interval: 300
  keepRecent: null # e.g. 1d
  resources: {}

# Substituters the workers use besides the niks3 cache.
upstreamCaches:
  urls: [https://cache.nixos.org]
  publicKeys: ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="]

sandbox:
  # Runs the nix-daemon container privileged. Without it builds are unsandboxed.
  enabled: true

logLevel: info
# On pod shutdown the worker tells the scheduler it is draining and exits once
# running builds have published. Kubelet kills what is left after this long.
terminationGracePeriodSeconds: 3600

lb:
  enabled: true
  replicas: 2
  maxStreams: 1024
  healthCheckInterval: 5s
  accessLog: false
  service:
    type: ClusterIP
    port: 50051
    nodePort: null
    annotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  spread: true
  podAnnotations: {}

metrics:
  interval: 30s
  # prometheus-operator
  podMonitor:
    enabled: false
    labels: {}
  # VictoriaMetrics operator
  vmPodScrape:
    enabled: false

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
